[project]
name = "agent-sdf"
version = "0.1.0"
description = "GLSL signed distance geometry and rendering"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<13",
    "playwright>=1.55,<2",
]

[project.optional-dependencies]
scientific = ["scipy>=1,<2"]

[project.scripts]
sdf-render = "sdf_kernel.renderer:main"
sdf-contact-sheet = "sdf_kernel.contact_sheet:main"
sdf-view = "sdf_kernel.viewer:main"
sdf-view-glsl = "sdf_kernel.glsl_viewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdf_kernel"]

[dependency-groups]
dev = ["ruff>=0.14,<1", "scipy>=1,<2"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["tests", "test_transforms.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
