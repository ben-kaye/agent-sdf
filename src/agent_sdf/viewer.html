<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLSL SDF Viewer</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #eef2f5; background: #151a20; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    header, footer { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
    header { justify-content: space-between; gap: 20px; border-bottom: 1px solid #333c45; background: #1b2229; }
    footer { border-top: 1px solid #333c45; color: #a9b5c0; font-size: 12px; }
    .identity { min-width: 0; }
    .eyebrow { display: block; margin-bottom: 2px; color: #82b7dc; font-size: 10px; font-weight: 750; letter-spacing: .13em; }
    .scene-line { display: flex; align-items: center; gap: 12px; }
    h1 { overflow: hidden; max-width: 28ch; font-size: 16px; font-weight: 650; margin: 0; text-overflow: ellipsis; text-transform: capitalize; white-space: nowrap; }
    .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex-wrap: wrap; }
    .slider-control { width: 142px; }
    .slider-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; color: #b5c1cb; font-size: 11px; }
    .slider-label output { color: #f1f5f8; font-variant-numeric: tabular-nums; font-weight: 650; }
    input[type="range"] { display: block; width: 100%; height: 18px; margin: 0; accent-color: #8bc7ef; cursor: pointer; }
    input[type="range"]:disabled { cursor: not-allowed; opacity: .38; }
    .slider-control:has(input:disabled) .slider-label { opacity: .5; }
    .actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    details { position: relative; }
    summary { cursor: pointer; color: #bdcbd6; font-size: 12px; }
    .finishes { position: absolute; z-index: 2; top: 28px; left: 0; min-width: 220px;
                padding: 10px; border: 1px solid #46525f; border-radius: 8px; background: #222b34;
                box-shadow: 0 12px 28px #0007; }
    .finish { display: flex; align-items: center; gap: 9px; white-space: nowrap; padding: 4px 0; }
    .swatch { width: 18px; height: 18px; border: 1px solid #ffffff44; border-radius: 4px; }
    .finish small { color: #a9b5c0; margin-left: auto; }
    .grow { flex: 1; }
    button { appearance: none; border: 1px solid #46525f; border-radius: 7px; background: #222b34;
             color: inherit; padding: 7px 10px; font: inherit; cursor: pointer; }
    button:hover { background: #33414d; }
    button:focus-visible, summary:focus-visible, input:focus-visible, .stage:focus-visible { outline: 2px solid #77bbec; outline-offset: 2px; }
    .stage-wrap { min-height: 0; display: grid; place-items: center; padding: 24px; }
    .stage { width: min(100%, calc((100vh - 174px) * 4 / 3)); aspect-ratio: 4 / 3;
             position: relative; background: #e8e8e2; border-radius: 10px; overflow: hidden;
             cursor: grab; touch-action: none; box-shadow: 0 20px 65px #0008; }
    .stage.dragging { cursor: grabbing; }
    .stage canvas { width: 100%; height: 100%; display: block; object-fit: fill; pointer-events: none; }
    .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                    border: 1px solid #ffffff24; border-radius: inherit; }
    .hint { position: absolute; left: 14px; bottom: 14px; padding: 6px 9px;
            border-radius: 5px; color: #293039; background: #ffffffe8; font-size: 12px; }
    .pick-panel { position: absolute; top: 14px; right: 14px; width: min(300px, calc(100% - 28px));
                  padding: 11px 13px; border: 1px solid #ffffff55; border-radius: 8px;
                  background: #1b2229ed; color: #eef2f5; box-shadow: 0 8px 28px #0006;
                  pointer-events: none; font-size: 12px; }
    .pick-panel[hidden] { display: none; }
    .pick-panel strong { display: block; margin-bottom: 6px; font-size: 13px; }
    .pick-panel dl { display: grid; grid-template-columns: 75px 1fr; gap: 3px 8px; margin: 0; }
    .pick-panel dt { color: #a9b5c0; }
    .pick-panel dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, monospace; }
    .pick-measure { margin-top: 8px; padding-top: 8px; border-top: 1px solid #ffffff35; }
    .status { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #75c58a; }
    .busy .dot { background: #e9bd69; }
    .error .dot { background: #ef7979; }
    .error-details { position: fixed; z-index: 4; right: 16px; bottom: 48px;
                     max-width: min(720px, calc(100vw - 32px)); }
    .error-details summary { padding: 7px 10px; border: 1px solid #a95e5e; border-radius: 6px;
                             background: #38282b; color: #ffd5d5; }
    .error-details pre { max-height: min(50vh, 420px); overflow: auto; margin: 4px 0 0;
                         padding: 12px; border: 1px solid #a95e5e; border-radius: 6px;
                         background: #231b1d; color: #ffd5d5; font: 12px/1.4 ui-monospace, monospace;
                         white-space: pre-wrap; overflow-wrap: anywhere; }
    .fps { min-width: 58px; color: #d3e7f5; font-variant-numeric: tabular-nums; }
    .camera { font-family: ui-monospace, SFMono-Regular, monospace; }
    .embed header, .embed footer { display: none; }
    .embed .stage-wrap { padding: 0; }
    .embed .stage { width: 100%; max-width: none; height: 100vh; border-radius: 0; }
    .embed .hint { display: none; }
    @media (max-width: 1050px) {
      header { align-items: flex-start; flex-direction: column; gap: 12px; }
      .toolbar { justify-content: flex-start; width: 100%; }
    }
    @media (max-width: 650px) {
      header { padding: 12px; }
      .toolbar { gap: 10px 18px; }
      .slider-control { width: min(142px, calc((100vw - 42px) / 2)); }
      .actions { width: 100%; }
      button { padding: 7px 8px; font-size: 12px; }
      footer { flex-wrap: wrap; }
      .camera { display: none; }
      .stage-wrap { place-items: start center; padding: 16px 8px; }
      .stage { width: 100%; }
      .hint { left: 8px; bottom: 8px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="identity">
        <span class="eyebrow">GLSL VIEWER</span>
        <div class="scene-line">
          <h1 id="name">SDF Viewer</h1>
          <details id="materials" hidden><summary>Materials</summary><div class="finishes" id="finishes"></div></details>
        </div>
      </div>
      <div class="toolbar">
        <div class="slider-control">
          <div class="slider-label"><label for="fov">Field of view</label><output id="fov-value" for="fov">40°</output></div>
          <input id="fov" type="range" min="1" max="120" step="1" value="40" aria-label="Field of view in degrees">
        </div>
        <div class="slider-control">
          <div class="slider-label"><label for="resolution">Resolution</label><output id="resolution-value" for="resolution">100%</output></div>
          <input id="resolution" type="range" min="50" max="150" step="10" value="100" aria-label="Render resolution percentage">
        </div>
        <div class="actions">
          <button id="projection" title="Switch projection">Perspective</button>
          <button id="reset" title="Reset camera">Reset view</button>
          <button id="download" title="Save the current image">Save PNG</button>
          <button id="copy" title="Copy camera coordinates">Copy camera</button>
        </div>
      </div>
    </header>
    <main class="stage-wrap">
      <div class="stage" id="stage" tabindex="0" aria-label="3D model viewer. Click a surface to inspect it, click another to measure distance. Left drag to orbit, right drag to pan, scroll to zoom.">
        <canvas id="image" aria-label="GPU rendered 3D model"></canvas>
        <div class="hint" id="hint">Click to inspect · Click twice to measure · Drag to orbit</div>
        <div class="pick-panel" id="pick-panel" aria-live="polite" hidden></div>
      </div>
    </main>
    <footer>
      <span class="status busy" id="status"><span class="dot"></span><span id="status-text">Loading scene…</span></span>
      <span id="metrics"></span><span class="fps" id="fps" title="Render updates per second while interacting">FPS idle</span><span class="grow"></span><span class="camera" id="camera"></span>
      <details id="error-details" class="error-details" hidden><summary>View error details</summary><pre id="error-message"></pre></details>
    </footer>
  </div>
  <script>
    function reportStartupError(message) {
      document.getElementById('status').className = 'status error';
      document.getElementById('status-text').textContent = message;
    }
    window.addEventListener('error', event => reportStartupError(event.message || 'Viewer startup failed.'));
    window.addEventListener('unhandledrejection', event =>
      reportStartupError(event.reason?.message || String(event.reason)));
  </script>
  <script>
    if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
    const $ = (id) => document.getElementById(id);
    const stage = $('stage');
    const image = $('image');
    let initial, camera, previousFov = 40;
    const refinementScales = [0.2, 0.35, 0.55, 0.8, 1];
    let drag = null, settledTimer = null, frameRequest = null, refinementStep = 3, renderRevision = 0;
    let canvasIntersecting = false;
    let frameTimes = [], fpsIdleTimer = null;
    let gl, program, uniforms, vertexArray, vertexBuffer, materialTexture;
    let ready = false, sceneSource, configData, appliedRevision = 0, reloadError = '';
    let pickedPoints = [], pickRequest = 0;
    let renderFence = null, renderStarted = 0, renderFenceRevision = 0;
    let compileMs = 0;
    const vertexSource = `#version 300 es
    layout(location = 0) in vec2 aPosition;
    void main() {
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }`;
    const fragmentBody = `
    uniform vec2 uResolution;
    uniform vec2 uRenderOffset;
    uniform vec3 uEye, uTarget, uUp;
    uniform float uFov, uCameraSize, uFar;
    uniform vec3 uBoundsMin, uBoundsMax;
    uniform bool uHasBounds;
    uniform highp sampler2D uMaterials;
    uniform int uMaterialCount;
    uniform bool uHasMaterials;
    uniform bool uFinal;
    uniform int uCaptureMode;
    out vec4 outColor;
    void main() {
      vec3 forward = normalize(uTarget - uEye);
      vec3 right = normalize(cross(forward, uUp));
      vec3 up = cross(right, forward);
      bool ortho = uFov == 0.0;
      float spread = ortho ? uCameraSize * 0.5 : tan(radians(uFov) * 0.5);
      vec2 pixel = gl_FragCoord.xy + uRenderOffset;
      vec2 uv = (2.0 * pixel / uResolution - 1.0) * spread;
      uv.x *= uResolution.x / uResolution.y;
      vec3 displacement = uv.x * right + uv.y * up;
      vec3 origin = ortho ? uEye + displacement : uEye;
      vec3 ray = ortho ? forward : normalize(forward + displacement);
      float sky = 1.0 - pixel.y / uResolution.y;
      vec3 background = (vec3(244,244,240) - vec3(24,21,16) * sky) / 255.0;
      vec4 miss = uCaptureMode == 2 ? vec4(1.0) :
        (uCaptureMode == 1 ? vec4(0.0) : vec4(background, 1.0));
      float near = 0.0, far = uFar;
      if (uHasBounds) {
        float padding = max(0.01, 0.0001 * length(uBoundsMax - uBoundsMin));
        vec3 lo = uBoundsMin - vec3(padding);
        vec3 hi = uBoundsMax + vec3(padding);
        for (int axis = 0; axis < 3; axis++) {
          if (abs(ray[axis]) < 1e-7) {
            if (origin[axis] < lo[axis] || origin[axis] > hi[axis]) {
              outColor = miss; return;
            }
          } else {
            float a = (lo[axis] - origin[axis]) / ray[axis];
            float b = (hi[axis] - origin[axis]) / ray[axis];
            near = max(near, min(a, b));
            far = min(far, max(a, b));
          }
        }
        if (far < near) { outColor = miss; return; }
      }
      float travel = near;
      vec3 composed = vec3(0);
      float transmission = 1.0;
      bool escaping = false;
      int layers = 0;
      for (int i = 0; i < 4; i++) {
        vec3 hit;
        int hitPart;
        float hitTravel;
        if (!traceSurface(origin, ray, travel, far, escaping, hitTravel, hit, hitPart)) break;
        travel = hitTravel;
        vec3 p = origin + travel * ray;
        if (uCaptureMode == 2) {
          float packed = floor(clamp(travel / uFar, 0.0, 1.0) * 16777214.0 + 0.5);
          outColor = vec4(vec3(floor(packed / 65536.0),
            floor(mod(packed, 65536.0) / 256.0), mod(packed, 256.0)) / 255.0, 1.0);
          return;
        }
        vec2 e = vec2(0.002, 0);
        vec3 gradient = vec3(
          mapHitSurface(p+e.xyy, hitPart).x-mapHitSurface(p-e.xyy, hitPart).x,
          mapHitSurface(p+e.yxy, hitPart).x-mapHitSurface(p-e.yxy, hitPart).x,
          mapHitSurface(p+e.yyx, hitPart).x-mapHitSurface(p-e.yyx, hitPart).x);
        vec3 normal = gradient / max(length(gradient), 1e-12);
        vec3 light = normalize(vec3(0.55,-0.45,0.7));
        float diffuse = max(0.0, dot(normal, light));
        float rim = max(0.0, dot(normal, -ray));
        float ambient = 1.0;
        float visibility = 1.0;
        if (uFinal) {
          float occlusion = 0.0;
          float probe = mapScene(p + normal * 0.06).x;
          occlusion += 0.5 * max(0.06 - probe, 0.0) / 0.06;
          probe = mapScene(p + normal * 0.16).x;
          occlusion += 0.3 * max(0.16 - probe, 0.0) / 0.16;
          probe = mapScene(p + normal * 0.35).x;
          occlusion += 0.2 * max(0.35 - probe, 0.0) / 0.35;
          ambient = clamp(1.0 - 0.7 * occlusion, 0.45, 1.0);
          float shadowTravel = 0.02;
          for (int j = 0; j < 24; j++) {
            vec3 shadowPoint = p + normal * 0.01 + light * shadowTravel;
            vec2 shadowQuery = mapQuery(shadowPoint, light);
            float shadowDistance = shadowQuery.x;
            visibility = min(visibility, clamp(10.0 * shadowDistance / shadowTravel, 0.0, 1.0));
            float shadowStep = shadowQuery.y;
            if (shadowStep <= 0.0) break;
            shadowTravel += shadowStep;
            if (shadowTravel > uFar || visibility < 0.02) break;
          }
        }
        float level = min(1.0, 0.24 * ambient + 0.66 * diffuse * visibility + 0.10 * rim);
        int material = ((int(hit.y) % uMaterialCount) + uMaterialCount) % uMaterialCount;
        vec4 finish = texelFetch(uMaterials, ivec2(material, 0), 0);
        vec4 surface = texelFetch(uMaterials, ivec2(material, 1), 0);
        float rough = surface.r;
        vec3 color = finish.rgb * level;
        if (uHasMaterials) {
          vec3 halfVector = normalize(light - ray);
          float gloss = pow(max(0.0, dot(normal, halfVector)), 2.0 / max(rough*rough, 0.025));
          float highlight = gloss * (0.10 + 0.28 * finish.a) * (1.0 - 0.35 * rough);
          color = min(vec3(1), color + highlight * mix(vec3(1), finish.rgb, finish.a));
        }
        composed += transmission * surface.g * color;
        transmission *= 1.0 - surface.g;
        layers++;
        if (layers >= 4 || transmission <= 1.0 / 255.0) break;
        travel += 0.002;
        escaping = true;
      }
      float alpha = 1.0 - transmission;
      outColor = uCaptureMode == 1 ? vec4(composed / max(alpha, 1e-6), alpha) :
        (uCaptureMode == 2 ? miss : vec4(composed + transmission * background, 1.0));
    }`;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    }
    async function initGL(nextConfig, nextSource) {
      gl = image.getContext('webgl2', { alpha: true, premultipliedAlpha: false,
        antialias: false, preserveDrawingBuffer: true });
      if (!gl) throw new Error('WebGL2 is unavailable. Enable browser graphics acceleration.');
      status('Compiling scene on GPU…', 'busy');
      const started = performance.now();
      const parallel = gl.getExtension('KHR_parallel_shader_compile');
      const vert = compileShader(gl.VERTEX_SHADER, vertexSource);
      const frag = compileShader(gl.FRAGMENT_SHADER,
        '#version 300 es\nprecision highp float;\nprecision highp int;\n' + nextSource + fragmentBody);
      const nextProgram = gl.createProgram();
      try {
        gl.attachShader(nextProgram, vert); gl.attachShader(nextProgram, frag); gl.linkProgram(nextProgram);
        if (parallel) {
          while (!gl.getProgramParameter(nextProgram, parallel.COMPLETION_STATUS_KHR)) {
            if (gl.isContextLost()) throw new Error('Graphics context lost while compiling. Reload to retry.');
            await new Promise(resolve => setTimeout(resolve, 50));
          }
        }
        if (!gl.getProgramParameter(nextProgram, gl.LINK_STATUS)) {
          const message = gl.getShaderInfoLog(frag) || gl.getShaderInfoLog(vert) ||
            gl.getProgramInfoLog(nextProgram);
          throw new Error('GLSL compilation failed: ' + message);
        }
      } catch (error) {
        gl.deleteProgram(nextProgram);
        throw error;
      } finally {
        gl.deleteShader(vert); gl.deleteShader(frag);
      }
      if (renderFence) { gl.deleteSync(renderFence); renderFence = null; }
      pauseRendering();
      renderRevision++;
      const oldProgram = program, oldTexture = materialTexture;
      program = nextProgram;
      gl.useProgram(program);
      if (!vertexArray) {
        vertexArray = gl.createVertexArray();
        vertexBuffer = gl.createBuffer();
      }
      gl.bindVertexArray(vertexArray);
      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      uniforms = Object.fromEntries(['Resolution','RenderOffset','Eye','Target','Up','Fov','CameraSize','Far','BoundsMin','BoundsMax','HasBounds','Materials','MaterialCount','HasMaterials','Final','CaptureMode']
        .map(name => [name, gl.getUniformLocation(program, 'u' + name)]));
      gl.uniform1i(uniforms.HasBounds, !!nextConfig.bounds);
      if (nextConfig.bounds) {
        gl.uniform3fv(uniforms.BoundsMin, nextConfig.bounds[0]);
        gl.uniform3fv(uniforms.BoundsMax, nextConfig.bounds[1]);
      }
      const count = nextConfig.palette.length;
      const pixels = new Float32Array(count * 8);
      nextConfig.palette.forEach((color, i) => {
        pixels.set([...color.map(v => v / 255), nextConfig.metallic[i]], i * 4);
        pixels[count * 4 + i * 4] = nextConfig.roughness[i];
        pixels[count * 4 + i * 4 + 1] = nextConfig.opacity[i];
      });
      gl.activeTexture(gl.TEXTURE0);
      materialTexture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, materialTexture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, count, 2, 0, gl.RGBA, gl.FLOAT, pixels);
      gl.uniform1i(uniforms.Materials, 0);
      gl.uniform1i(uniforms.MaterialCount, count);
      gl.uniform1i(uniforms.HasMaterials, Object.keys(nextConfig.materials).length > 0);
      gl.uniform1i(uniforms.Final, !!nextConfig.final);
      gl.uniform1i(uniforms.CaptureMode, nextConfig.captureMode || 0);
      if (oldProgram) gl.deleteProgram(oldProgram);
      if (oldTexture) gl.deleteTexture(oldTexture);
      configData = nextConfig;
      sceneSource = nextSource;
      initial = { ...nextConfig, orientation: nextConfig.orientation || initialOrientation(nextConfig) };
      if (!camera) {
        camera = structuredClone(initial);
        previousFov = camera.fov || 40;
      }
      document.title = `${nextConfig.name} · GLSL Viewer`;
      $('name').textContent = nextConfig.name;
      showMaterials(nextConfig.materials);
      compileMs = performance.now() - started;
      ready = true;
      clearReloadError();
      queueRender(document.body.classList.contains('embed'));
    }
    function pollRender() {
      if (!renderFence || !ready) return;
      const result = gl.clientWaitSync(renderFence, 0, 0);
      if (result === gl.TIMEOUT_EXPIRED) { setTimeout(pollRender, 50); return; }
      gl.deleteSync(renderFence);
      renderFence = null;
      if (result === gl.WAIT_FAILED) { status('GPU render failed', 'error'); return; }
      const elapsed = performance.now() - renderStarted;
      $('metrics').textContent = `${image.width} × ${image.height} · Render ${elapsed.toFixed(0)} ms`;
      if (!isCanvasVisible()) return;
      if (renderFenceRevision !== renderRevision) { scheduleDraw(); return; }
      image.dataset.renderComplete = String(renderRevision);
      if (refinementStep === refinementScales.length - 1) return;
      const next = refinementScales[refinementStep + 1] / refinementScales[refinementStep];
      if (elapsed * next * next > 1200) {
        status('Preview resolution limited by render time');
        return;
      }
      const revision = renderRevision;
      settledTimer = setTimeout(() => {
        if (revision !== renderRevision) return;
        refinementStep++;
        scheduleDraw();
      }, 120);
    }
    function farDistance() {
      if (!configData.autoFar) return camera.far;
      const radius = norm(vec(camera.eye, camera.target));
      let far = Math.max(camera.far, 2.5 * radius);
      if (configData.bounds) {
        const [lo, hi] = configData.bounds;
        const orthoOffset = camera.fov === 0 ?
          camera.cameraSize * Math.hypot(image.width / image.height, 1) / 2 : 0;
        for (const x of [lo[0], hi[0]]) for (const y of [lo[1], hi[1]])
          for (const z of [lo[2], hi[2]])
            far = Math.max(far, 1.05 * norm(vec(camera.eye, [x, y, z])) + orthoOffset);
      }
      return far;
    }
    function draw() {
      if (!ready || !isCanvasVisible()) return;
      delete image.dataset.renderComplete;
      const scale = Number($('resolution').value) / 100 * refinementScales[refinementStep];
      const width = configData.renderViewport?.[0] ?? Math.max(1, Math.min(4096, Math.round(stage.clientWidth * scale)));
      const height = configData.renderViewport?.[1] ?? Math.max(1, Math.round(width * stage.clientHeight / stage.clientWidth));
      const maximumSize = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE);
      const maximumViewport = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
      if (width > Math.min(maximumSize, maximumViewport[0]) || height > Math.min(maximumSize, maximumViewport[1])) {
        throw new Error('Render viewport exceeds GPU limits. Use a smaller tile size.');
      }
      if (image.width !== width || image.height !== height) { image.width = width; image.height = height; }
      gl.viewport(0, 0, width, height);
      gl.uniform2fv(uniforms.Resolution, configData.renderSize || [width, height]);
      gl.uniform2fv(uniforms.RenderOffset, configData.renderOffset || [0, 0]);
      gl.uniform3fv(uniforms.Eye, camera.eye); gl.uniform3fv(uniforms.Target, camera.target);
      gl.uniform3fv(uniforms.Up, rotateVector(camera.orientation, [0, 1, 0]));
      gl.uniform1f(uniforms.Fov, camera.fov); gl.uniform1f(uniforms.CameraSize, camera.cameraSize);
      gl.uniform1f(uniforms.Far, farDistance());
      gl.disable(gl.SCISSOR_TEST);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      renderFence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
      renderStarted = performance.now();
      renderFenceRevision = renderRevision;
      gl.flush();
      setTimeout(pollRender, 50);
      const now = performance.now();
      frameTimes.push(now);
      while (frameTimes[0] < now - 2000) frameTimes.shift();
      const span = now - frameTimes[0];
      $('fps').textContent = span >= 500 && frameTimes.length > 1 ?
        `FPS ${Math.round((frameTimes.length - 1) * 1000 / span)}` : 'FPS —';
      clearTimeout(fpsIdleTimer);
      fpsIdleTimer = setTimeout(() => {
        frameTimes = [];
        $('fps').textContent = 'FPS idle';
      }, 2500);
      status(`WebGL2 · GPU compile ${(compileMs / 1000).toFixed(2)} s`);
    }
    image.addEventListener('webglcontextlost', event => {
      event.preventDefault(); ready = false; renderFence = null;
      pauseRendering(); renderRevision++;
      status('Graphics context lost. Waiting for recovery…', 'error');
    });
    image.addEventListener('webglcontextrestored', () => {
      program = null; vertexArray = null; vertexBuffer = null; materialTexture = null;
      if (configData && sceneSource) initGL(configData, sceneSource).catch(error => showReloadError(error.message));
    });
    new ResizeObserver(() => queueRender(document.body.classList.contains('embed'))).observe(stage);
    new IntersectionObserver(entries => {
      canvasIntersecting = entries[0].isIntersecting;
      if (isCanvasVisible()) queueRender(document.body.classList.contains('embed'));
      else pauseRendering();
    }).observe(image);
    document.addEventListener('visibilitychange', () => {
      if (isCanvasVisible()) queueRender(document.body.classList.contains('embed'));
      else pauseRendering();
    });
    $('resolution').oninput = () => {
      $('resolution-value').textContent = `${$('resolution').value}%`;
      queueRender();
    };
    $('resolution').onchange = () => queueRender(true);

    function status(message, kind = '') {
      if (reloadError && kind !== 'error') return;
      $('status').className = `status ${kind}`;
      $('status-text').textContent = message;
    }
    function showReloadError(message) {
      reloadError = message || 'Unknown scene error';
      $('error-message').textContent = reloadError;
      $('error-details').hidden = false;
      $('error-details').open = true;
      status(ready ? 'Scene update failed · showing previous scene' : 'Scene unavailable', 'error');
    }
    function clearReloadError() {
      reloadError = '';
      $('error-details').hidden = true;
      $('error-details').open = false;
    }
    function showMaterials(materials) {
      const finishes = Object.entries(materials || {});
      $('materials').hidden = !finishes.length;
      $('finishes').replaceChildren();
      for (const [name, finish] of finishes) {
        const row = document.createElement('div');
        row.className = 'finish';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.backgroundColor = finish.base_color;
        const label = document.createElement('span');
        label.textContent = name.replaceAll('_', ' ');
        const values = document.createElement('small');
        values.textContent = `M ${finish.metallic.toFixed(2)} · R ${finish.roughness.toFixed(2)} · O ${(finish.opacity ?? 1).toFixed(2)}`;
        row.append(swatch, label, values);
        $('finishes').append(row);
      }
    }
    function vec(a, b) { return a.map((v, i) => v - b[i]); }
    function norm(v) { return Math.hypot(...v); }
    function unit(v) { const n = norm(v); return v.map(x => x / n); }
    function cross(a, b) {
      return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    }
    // Camera-to-world quaternion, stored as [w, x, y, z].
    function rotateVector(q, v) {
      const axis = q.slice(1);
      const t = cross(axis, v).map(x => 2 * x);
      const c = cross(axis, t);
      return v.map((x, i) => x + q[0] * t[i] + c[i]);
    }
    function initialOrientation(config) {
      const back = unit(vec(config.eye, config.target));
      const horizontal = Math.hypot(back[0], back[1]);
      const right = config.up ? unit(cross(config.up, back)) :
        horizontal > 1e-8 ? [-back[1] / horizontal, back[0] / horizontal, 0] : [1, 0, 0];
      const up = cross(back, right);
      const m00 = right[0], m01 = up[0], m02 = back[0];
      const m10 = right[1], m11 = up[1], m12 = back[1];
      const m20 = right[2], m21 = up[2], m22 = back[2];
      const trace = m00 + m11 + m22;
      let q, s;
      if (trace > 0) {
        s = 2 * Math.sqrt(trace + 1);
        q = [s/4, (m21-m12)/s, (m02-m20)/s, (m10-m01)/s];
      } else if (m00 > m11 && m00 > m22) {
        s = 2 * Math.sqrt(1 + m00 - m11 - m22);
        q = [(m21-m12)/s, s/4, (m01+m10)/s, (m02+m20)/s];
      } else if (m11 > m22) {
        s = 2 * Math.sqrt(1 + m11 - m00 - m22);
        q = [(m02-m20)/s, (m01+m10)/s, s/4, (m12+m21)/s];
      } else {
        s = 2 * Math.sqrt(1 + m22 - m00 - m11);
        q = [(m10-m01)/s, (m02+m20)/s, (m12+m21)/s, s/4];
      }
      return unit(q);
    }
    function updateCameraText() {
      $('camera').textContent = `Eye ${camera.eye.map(x => x.toFixed(2)).join(', ')} · Target ${camera.target.map(x => x.toFixed(2)).join(', ')}`;
      $('projection').textContent = camera.fov === 0 ? 'Orthographic' : 'Perspective';
      $('fov').disabled = camera.fov === 0;
      $('fov').value = camera.fov || previousFov;
      $('fov-value').textContent = `${camera.fov || previousFov}°`;
    }
    function pickRay(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      const x = 2 * (clientX - rect.left) / rect.width - 1;
      const y = 1 - 2 * (clientY - rect.top) / rect.height;
      const forward = unit(vec(camera.target, camera.eye));
      const right = unit(cross(forward, rotateVector(camera.orientation, [0, 1, 0])));
      const up = cross(right, forward);
      const spread = camera.fov === 0 ? camera.cameraSize / 2 : Math.tan(camera.fov * Math.PI / 360);
      const dx = x * spread * rect.width / rect.height;
      const dy = y * spread;
      const displacement = right.map((v, i) => dx * v + dy * up[i]);
      return camera.fov === 0 ? {
        origin: camera.eye.map((v, i) => v + displacement[i]), direction: forward
      } : {
        origin: camera.eye, direction: unit(forward.map((v, i) => v + displacement[i]))
      };
    }
    function showPick(hit, message = '') {
      const panel = $('pick-panel');
      panel.hidden = false;
      panel.replaceChildren();
      const title = document.createElement('strong');
      title.textContent = message || (hit ? 'Surface pick' : 'No surface at this point');
      panel.append(title);
      if (!hit) return;
      const rows = [
        ['Component', hit.instance_path?.length ? hit.instance_path.join('/') : '—'],
        ['Feature', hit.feature_name || 'Unnamed'],
        ['Material', hit.material_name || String(hit.material_id)],
        ['Point', hit.point.map(x => x.toFixed(4)).join(', ')],
        ['Normal', hit.normal.map(x => x.toFixed(4)).join(', ')],
        ['Ray distance', hit.distance.toFixed(4)]
      ];
      if (hit.contributors?.length > 1) rows.push(['Contributors', hit.contributors.join(', ')]);
      const details = document.createElement('dl');
      for (const [label, value] of rows) {
        const dt = document.createElement('dt'), dd = document.createElement('dd');
        dt.textContent = label; dd.textContent = value; details.append(dt, dd);
      }
      panel.append(details);
      if (pickedPoints.length === 2) {
        const measurement = document.createElement('div');
        measurement.className = 'pick-measure';
        measurement.textContent = `Point distance: ${norm(vec(pickedPoints[1], pickedPoints[0])).toFixed(4)} scene units`;
        panel.append(measurement);
      }
    }
    async function pick(clientX, clientY) {
      if (document.body.classList.contains('embed')) return;
      const requestId = ++pickRequest;
      const revision = appliedRevision;
      const ray = pickRay(clientX, clientY);
      showPick(null, 'Querying surface…');
      try {
        const response = await fetch('/pick', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...ray, max_distance: farDistance(), revision })
        });
        const result = await response.json();
        if (requestId !== pickRequest || revision !== appliedRevision) return;
        if (!response.ok) throw new Error(result.error || `Pick failed: ${response.status}`);
        if (!result.hit) { pickedPoints = []; showPick(null); return; }
        pickedPoints.push(result.hit.point);
        if (pickedPoints.length > 2) pickedPoints.shift();
        showPick(result.hit);
      } catch (error) {
        if (requestId === pickRequest) showPick(null, error.message);
      }
    }
    function isCanvasVisible() {
      if (document.hidden || !canvasIntersecting) return false;
      const rect = image.getBoundingClientRect();
      return rect.width > 0 && rect.height > 0 && rect.bottom > 0 && rect.right > 0 &&
        rect.top < innerHeight && rect.left < innerWidth && getComputedStyle(image).visibility === 'visible';
    }
    function pauseRendering() {
      clearTimeout(settledTimer);
      if (frameRequest !== null) cancelAnimationFrame(frameRequest);
      frameRequest = null;
    }
    function scheduleDraw() {
      if (frameRequest !== null || renderFence || !isCanvasVisible()) return;
      frameRequest = requestAnimationFrame(() => {
        frameRequest = null;
        if (!isCanvasVisible()) { pauseRendering(); return; }
        try { draw(); } catch (error) { status(error.message, 'error'); return; }
      });
    }
    function queueRender(full = false) {
      if (!camera || !ready) return;
      clearTimeout(settledTimer);
      renderRevision++;
      refinementStep = full ? refinementScales.length - 1 : 0;
      updateCameraText();
      scheduleDraw();
    }
    function orbit(dx, dy) {
      const offset = vec(camera.eye, camera.target);
      const radius = norm(offset);
      const azimuth = Math.atan2(offset[1], offset[0]) - dx * 0.008;
      const elevation = Math.max(-Math.PI / 2 + 1e-4,
        Math.min(Math.PI / 2 - 1e-4, Math.asin(offset[2] / radius) + dy * 0.008));
      camera.eye = [
        camera.target[0] + radius * Math.cos(elevation) * Math.cos(azimuth),
        camera.target[1] + radius * Math.cos(elevation) * Math.sin(azimuth),
        camera.target[2] + radius * Math.sin(elevation)
      ];
      camera.orientation = initialOrientation(camera);
    }
    function pan(dx, dy) {
      const right = rotateVector(camera.orientation, [1, 0, 0]);
      const up = rotateVector(camera.orientation, [0, 1, 0]);
      const scale = (camera.fov === 0 ? camera.cameraSize :
        2 * norm(vec(camera.eye, camera.target)) * Math.tan(camera.fov * Math.PI / 360)) / stage.clientHeight;
      const shift = right.map((v, i) => -dx * scale * v + dy * scale * up[i]);
      camera.eye = camera.eye.map((v, i) => v + shift[i]);
      camera.target = camera.target.map((v, i) => v + shift[i]);
    }
    stage.addEventListener('pointerdown', event => {
      if (!ready || (event.button !== 0 && event.button !== 2)) return;
      event.preventDefault();
      stage.focus({ preventScroll: true });
      stage.setPointerCapture(event.pointerId);
      drag = { x: event.clientX, y: event.clientY, startX: event.clientX, startY: event.clientY,
        pointerId: event.pointerId, pan: event.button === 2 || event.shiftKey, moved: false };
      stage.classList.add('dragging');
    });
    stage.addEventListener('pointermove', event => {
      if (!drag || !camera) return;
      const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      drag.x = event.clientX; drag.y = event.clientY;
      if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) > 4) drag.moved = true;
      if (!dx && !dy) return;
      if (drag.pan || event.shiftKey) pan(dx, dy); else orbit(dx, dy);
      queueRender();
    });
    function endDrag() {
      if (!drag) return;
      drag = null;
      stage.classList.remove('dragging');
    }
    stage.addEventListener('pointerup', event => {
      if (drag?.pointerId === event.pointerId && !drag.pan && !drag.moved) {
        const rect = stage.getBoundingClientRect();
        if (event.clientX >= rect.left && event.clientX <= rect.right &&
            event.clientY >= rect.top && event.clientY <= rect.bottom) pick(event.clientX, event.clientY);
      }
      endDrag();
    });
    stage.addEventListener('pointercancel', endDrag);
    stage.addEventListener('lostpointercapture', endDrag);
    stage.addEventListener('keydown', event => {
      if (!ready || !['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) return;
      event.preventDefault();
      orbit(event.key === 'ArrowLeft' ? -12 : event.key === 'ArrowRight' ? 12 : 0,
        event.key === 'ArrowUp' ? 12 : event.key === 'ArrowDown' ? -12 : 0);
      queueRender();
    });
    stage.addEventListener('contextmenu', event => event.preventDefault());
    stage.addEventListener('wheel', event => {
      if (!camera) return;
      event.preventDefault();
      const factor = Math.exp(Math.max(-300, Math.min(300, event.deltaY)) * 0.001);
      if (camera.fov === 0) camera.cameraSize = Math.max(0.01, Math.min(1000, camera.cameraSize * factor));
      else {
        const offset = vec(camera.eye, camera.target);
        const ratio = Math.max(0.01, Math.min(1000, norm(offset) * factor)) / norm(offset);
        camera.eye = camera.target.map((v, i) => v + offset[i] * ratio);
      }
      queueRender();
    }, { passive: false });
    $('fov').oninput = () => {
      if (!camera || camera.fov === 0) return;
      camera.fov = Number($('fov').value);
      previousFov = camera.fov;
      queueRender();
    };
    $('fov').onchange = () => queueRender();
    $('projection').onclick = () => {
      if (!ready) return;
      const radius = norm(vec(camera.eye, camera.target));
      if (camera.fov === 0) camera.fov = previousFov;
      else {
        previousFov = camera.fov;
        camera.cameraSize = 2 * radius * Math.tan(camera.fov * Math.PI / 360);
        camera.fov = 0;
      }
      queueRender();
    };
    $('reset').onclick = () => {
      if (!ready) return;
      camera = structuredClone(initial);
      previousFov = camera.fov || 40;
      queueRender();
    };
    $('download').onclick = () => {
      if (!ready) return;
      if (!isCanvasVisible()) { status('Bring the canvas into view to save PNG'); return; }
      pauseRendering();
      renderRevision++;
      refinementStep = refinementScales.length - 1;
      draw();
      image.toBlob(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `${initial.name.replaceAll(' ', '-')}-glsl.png`; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 'image/png');
    };
    $('copy').onclick = async () => {
      if (!camera) return;
      try {
        await navigator.clipboard.writeText(JSON.stringify({
          eye: camera.eye, target: camera.target, fov: camera.fov,
          camera_size: camera.cameraSize, far: farDistance(),
          up: rotateVector(camera.orientation, [0, 1, 0]), orientation: camera.orientation
        }, null, 2));
        status('Camera copied');
      } catch { status('Clipboard unavailable in this browser', 'error'); }
    };
    async function fetchResource(path, json = false, allowMissing = false) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(path, { signal: controller.signal });
        if (allowMissing && response.status === 404) return null;
        if (!response.ok) throw new Error(`Could not load ${path}: ${response.status}`);
        return await (json ? response.json() : response.text());
      } catch (error) {
        if (controller.signal.aborted) throw new Error(`Loading ${path} timed out. Reload to retry.`);
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }
    async function applySceneState(state) {
      if (state.revision > appliedRevision && state.config && state.shader) {
        try {
          await initGL(state.config, state.shader);
          appliedRevision = state.revision;
          pickedPoints = [];
          pickRequest++;
          $('pick-panel').hidden = true;
        } catch (error) {
          if (!gl?.isContextLost()) appliedRevision = state.revision;
          showReloadError(error.message);
        }
      }
      if (state.error) showReloadError(state.error);
      else if (state.compiling && !reloadError) status('Translating edited scene…', 'busy');
    }
    async function pollScene() {
      try {
        await applySceneState(await fetchResource('state', true));
      } catch (error) {
        showReloadError(error.message);
      } finally {
        setTimeout(pollScene, 700);
      }
    }
    async function start() {
      const state = await fetchResource('state', true, true);
      if (state) {
        await applySceneState(state);
        setTimeout(pollScene, 700);
      } else {
        const [config, shader] = await Promise.all([
          fetchResource('config', true), fetchResource('scene.glsl')
        ]);
        await initGL(config, shader);
      }
    }
    start().catch(error => showReloadError(error.message || 'Could not load scene'));
  </script>
</body>
</html>
